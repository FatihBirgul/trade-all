name: Android frontend checks
on: [push, pull_request]
concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true
env:
  EXPO_NO_TELEMETRY: "1"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -q
      - run: python3 scripts/verify-brand.py
      - run: python3 scripts/verify-startup.py
      - run: npm run doctor:local
      - run: EXPO_OFFLINE=1 npx expo export --platform android
