name: V2 isolated unit tests

on:
  push:
    branches: [trade-ai-v2, codex/task11-paper-integrity-20261031, codex/task12-ledger-replay-audit, codex/task13-domain-event-journal, codex/trade-ai-v2-master-development, codex/trade-ai-v2-master-continuation, codex/trade-ai-v2-product-integration, codex/trade-ai-v2-equity-history, codex/trade-ai-v2-history-research, codex/trade-ai-v2-notification-controls, codex/v2-immutable-research-anchor, codex/v2-release-candidate, codex/v2-opportunity-discovery, codex/v2-scanner-activation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-pure-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    # Windows audit/OOS fixtures perform many durable SQLite transactions.
    # One measured Python3.12 run exceeded10min; retain all checks with a bound.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check existing backend and V2 modules
        working-directory: backend
        run: python -m compileall -q market_ai server.py start_v2.py scripts
      - name: Install isolated numerical test dependencies
        run: python -m pip install -r backend/requirements-v2-tests.txt
      - name: Run V2 deterministic unit tests (no external services)
        working-directory: backend
        run: python -W error::ResourceWarning tests/run_v2_offline_tests.py
      - name: Run inspected offline outcome and quote contract regressions
        working-directory: backend
        run: python -m pytest -c tests/pytest-v2.ini tests/test_outcomes.py::TestOutcomeEngineUnit tests/test_v2_mobile_quotes.py -q

      - name: Validate Windows launcher syntax without running it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ParseErrors = $null
          $Tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'backend/start_v2_windows.ps1'), [ref]$Tokens, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count -gt 0) { throw ($ParseErrors | Out-String) }
