name: V2 mobile quote contract
on:
  push:
    branches: [codex/v2-mobile-quotes-20261026]
  pull_request:
permissions:
  contents: read
jobs:
  quotes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r backend/requirements-v2-tests.txt
      - name: Existing offline V2 regressions
        working-directory: backend
        run: python -W error::ResourceWarning tests/run_v2_offline_tests.py
      - run: PYTHONPATH=backend python -m pytest -c backend/tests/pytest-v2.ini backend/tests/test_v2_mobile_quotes.py -q
