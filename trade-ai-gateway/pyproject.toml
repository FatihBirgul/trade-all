[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "trade-ai-gateway"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.14", "pydantic==2.11.7", "httpx==0.28.1", "uvicorn==0.34.3", "jsonschema==4.25.1"]
[project.optional-dependencies]
test = ["pytest==8.4.2"]
[tool.setuptools.packages.find]
include = ["trade_gateway*"]
[tool.setuptools.package-data]
trade_gateway = ["openapi.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
