# Trade Bot: sistem gunlugunun diskte kaplayacagi alani sinirlar (journald gunlukleri kendisi dondurur).
# Kurulum: install.sh bu dosyayi /etc/systemd/journald.conf.d/tradebot.conf olarak kopyalar.
# Not: ayar sunucudaki TUM servislerin gunlugu icin gecerlidir.
[Journal]
SystemMaxUse=300M
SystemKeepFree=500M
MaxRetentionSec=30day
