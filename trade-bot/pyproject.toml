[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Exness Trading API uzerinde calisan 7/24 trade botu"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "websockets>=13",
    "cryptography>=42",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.setuptools.package-data]
tradebot = ["store/*.sql", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
