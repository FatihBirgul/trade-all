name: Deploy trade bot
on:
  push:
    branches: [main]
    paths:
      - 'trade-bot/**'
      - 'trade-ai-unified/**'
      - '.github/workflows/deploy-trade-bot.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy: test + dagitim. status: yalnizca botun saglik ciktisini oku (dagitim yok).'
        type: choice
        options: [deploy, status]
        default: deploy
permissions:
  contents: read
concurrency:
  group: deploy-trade-bot
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  test:
    if: inputs.mode != 'status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'trade-bot[dev]' -r trade-ai-unified/requirements-lock.txt
      - run: python -m pytest -q trade-bot
      - name: V9 suites (the bot imports this engine)
        working-directory: trade-ai-unified
        run: |
          python scripts/check_sources.py
          python scripts/run_suite.py engine
  deploy:
    needs: test
    # status kipinde test atlanir; dagitim yalnizca testler gectiyse yapilir.
    if: ${{ !cancelled() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && inputs.mode == 'status')) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: trade-bot/deploy
      - name: Deploy over SSH
        env:
          MODE: ${{ inputs.mode }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_HOST, VPS_USER ve VPS_SSH_KEY secret'lari tanimli olmali (trade-bot/deploy/README.md)"
            exit 1
          fi
          port="${VPS_PORT:-22}"
          install -d -m 700 ~/.ssh
          # Secret elle yapistirilirken satir sonlari/bosluklar bozulabilir; anahtar onarilir ve
          # baglanmadan once dogrulanir. Anahtarin icerigi hicbir zaman gunluge yazilmaz.
          python3 trade-bot/deploy/ssh_key_normalize.py ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY gecerli bir ozel anahtar degil (eksik kopyalanmis ya da parola korumali). Sunucudaki /home/deploy/.ssh/github_deploy dosyasinin tamamini yeniden yapistirin."
            exit 1
          fi
          echo "deploy anahtari okundu: $(ssh-keygen -l -f ~/.ssh/deploy_key | awk '{print $2}')"
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS tanimli degil; sunucu anahtari bu calismada ssh-keyscan ile alindi"
            ssh-keyscan -p "$port" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          if [ "$MODE" = "status" ]; then
            remote='/opt/tradebot/trade-bot/deploy/status.sh'
          else
            remote='/opt/tradebot/trade-bot/deploy/deploy.sh'
          fi
          ssh -i ~/.ssh/deploy_key -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$remote"
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
