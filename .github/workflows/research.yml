name: Arastirma (Faz 5 walk-forward)
# Faz 5 strateji arastirmasi. Sunucuda HICBIR hesap yapilmaz ve sunucudan hicbir sey cekilmez.
#   data     : 6 yillik piyasa verisi (5 yil + 1 yil isinma). Exness'in son ~12 ayi, son yillik backtest calismasinin
#              "market-data" artifact'indan (yalnizca piyasa verisi); oncesi Dukascopy (FX, metal, endeks) ve
#              Binance (BTC, ETH). Yalnizca commit mesajinda [veri] varsa (ya da elle) yeniden indirilir; yoksa
#              trade-bot/tradebot/research/data_run.txt'deki calismanin verisi kullanilir.
#   run      : sembol basina bir is; walk-forward (KASA VERISI KESILMIS) + monkey test.
#   assemble : birlestirme, beklenen tesadufi gecen sayisi. KASA burada calismaz (ayri, bir kez).
# Artifact'lar herkese aciktir: yalnizca piyasa verisi ve benzetim sonucu, kisa saklama. Hesap verisi YOK.
on:
  workflow_dispatch:
    inputs:
      market_run:
        description: 'Exness piyasa verisinin alinacagi backtest calismasi (run id)'
        required: false
        default: '45909940950'
  push:
    branches: ['claude/faz5-**']
    paths:
      - '.github/workflows/research.yml'
      - 'trade-bot/tradebot/research/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      fetch: ${{ steps.p.outputs.fetch }}
      symbols: ${{ steps.p.outputs.symbols }}
      data_run: ${{ steps.p.outputs.data_run }}
      mode: ${{ steps.p.outputs.mode }}
      holdout_runs: ${{ steps.p.outputs.holdout_runs }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: trade-bot/tradebot/research
      - id: p
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "symbols=$(python3 -c 'import json;print(json.dumps(json.load(open("trade-bot/tradebot/research/symbols.json"))))')" >> "$GITHUB_OUTPUT"
          # kip: base | d1 (ek kural) | holdout (KASA, bir kez) | prop (prop firma sinavi benzetimi) | done
          echo "mode=$(tr -d '[:space:]' < trade-bot/tradebot/research/mode.txt 2>/dev/null || echo base)" >> "$GITHUB_OUTPUT"
          echo "holdout_runs=$(tr '\n' ' ' < trade-bot/tradebot/research/holdout_runs.txt 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ] || printf '%s' "$MESSAGE" | grep -q '\[veri\]' || [ ! -s trade-bot/tradebot/research/data_run.txt ]; then
            echo "fetch=true" >> "$GITHUB_OUTPUT"; echo "data_run=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "fetch=false" >> "$GITHUB_OUTPUT"; echo "data_run=$(tr -d '[:space:]' < trade-bot/tradebot/research/data_run.txt)" >> "$GITHUB_OUTPUT"
          fi
  probe:
    needs: prep
    if: needs.prep.outputs.fetch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kaynak yoklamasi (adres bicimi ve erisim)
        run: |
          set -u
          ok=0
          for u in "https://datafeed.dukascopy.com/datafeed/EURUSD/2023/00/BID_candles_hour_1.bi5" \
                   "https://datafeed.dukascopy.com/datafeed/EURUSD/2023/00/01/BID_candles_min_1.bi5" \
                   "https://datafeed.dukascopy.com/datafeed/USA30IDXUSD/2023/00/BID_candles_hour_1.bi5" \
                   "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2023-01.zip"; do
            code=$(curl -sS -A "research-bot" -o /tmp/f -w "%{http_code}" --max-time 60 "$u" 2>/tmp/err || true)
            echo "yoklama: $code $(stat -c %s /tmp/f 2>/dev/null || echo 0) bayt $(head -c 200 /tmp/err) $u"
            head -c 120 /tmp/f | od -c | head -3
            [ "$code" = "200" ] && ok=$((ok+1))
          done
          echo "basarili: $ok"
  fetch:
    needs: [prep, probe]
    if: needs.prep.outputs.fetch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 33
      matrix:
        symbol: ${{ fromJson(needs.prep.outputs.symbols) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: trade-bot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -e trade-bot
      - name: Exness piyasa verisi (onceki calismanin artifact'i)
        uses: actions/download-artifact@v4
        with:
          name: market-data
          path: market
          run-id: ${{ inputs.market_run || '45909940950' }}
          github-token: ${{ github.token }}
      - name: Indir (${{ matrix.symbol }})
        working-directory: trade-bot
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          set -euo pipefail
          gunzip -k ../market/history.db.gz
          mkdir -p ../sym
          python -m tradebot.research.data --job ../market/job.json --exness ../market/history.db \
            --out "../sym/$SYMBOL.db" --only "$SYMBOL"
      - uses: actions/upload-artifact@v4
        with:
          name: sym-${{ matrix.symbol }}
          path: sym
          retention-days: 2
  data:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: trade-bot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -e trade-bot
      - uses: actions/download-artifact@v4
        with:
          pattern: sym-*
          path: sym
          merge-multiple: true
      - name: Birlestir
        working-directory: trade-bot
        run: |
          set -euo pipefail
          python -m tradebot.research.data --combine ../sym/*.db --out ../research.db
          python - <<'PY'
          import json, sqlite3
          db = sqlite3.connect("../research.db")
          meta = json.loads(db.execute("SELECT value FROM meta").fetchone()[0])
          for tf, n in db.execute("SELECT tf, COUNT(*) FROM bars GROUP BY tf"):
              print(tf, n)
          print("kaynak:", json.dumps({s: {k: v.get(k) for k in ("days", "source", "exness_h1", "other_h1", "missing_months",
                                                                    "failed", "compare", "error")}
                                        for s, v in meta["symbols"].items()}))
          PY
          gzip -1 ../research.db
      - uses: actions/upload-artifact@v4
        with:
          name: research-data
          path: research.db.gz
          retention-days: 7
  run:
    needs: [prep, data]
    if: always() && needs.prep.result == 'success' && needs.prep.outputs.mode != 'holdout' && needs.prep.outputs.mode != 'done' && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        symbol: ${{ fromJson(needs.prep.outputs.symbols) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            trade-bot
            trade-ai-unified
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -e trade-bot numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          name: research-data
          path: .
          run-id: ${{ needs.prep.outputs.data_run }}
          github-token: ${{ github.token }}
      - name: Walk-forward (${{ matrix.symbol }})
        working-directory: trade-bot
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          set -euo pipefail
          gunzip -k ../research.db.gz
          if [ "${{ needs.prep.outputs.mode }}" = "prop" ]; then
            python -m tradebot.research.run prop-symbol --data ../research.db --symbol "$SYMBOL" --out ../parts
          elif [ "${{ needs.prep.outputs.mode }}" = "d1" ]; then
            python -m tradebot.research.run symbol --data ../research.db --symbol "$SYMBOL" --out ../parts --d1-rule \
              --only A01_turtle_s1 A02_turtle_s2 A03_ma_cross A04_faber_sma200 A05_tsmom12 A06_clenow A09_psar A10_ichimoku A11_macd_zero
          else
            python -m tradebot.research.run symbol --data ../research.db --symbol "$SYMBOL" --out ../parts
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.symbol }}
          path: parts
          retention-days: 7
  assemble:
    needs: [prep, run]
    if: always() && needs.run.result != 'cancelled' && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: trade-bot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -e trade-bot
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - run: python -m pip install --quiet numpy==2.2.6
      - name: Birlestir (kasa YOK)
        working-directory: trade-bot
        run: |
          if [ "${{ needs.prep.outputs.mode }}" = "prop" ]; then
            python -m tradebot.research.run prop-assemble --parts ../parts --out ../wf.json
          else
            python -m tradebot.research.run assemble --parts ../parts --out ../wf.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: walk-forward
          path: wf.json
          retention-days: 14
  holdout:
    # KASA: yalnizca mode.txt = holdout iken; holdout_runs.txt'deki walk-forward calismalarinin BUTUN adaylari icin
    # BIR KEZ. Sonucuna gore hicbir kural ya da secim degistirilmez.
    needs: prep
    if: needs.prep.outputs.mode == 'holdout'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: trade-bot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -e trade-bot numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          name: research-data
          path: .
          run-id: ${{ needs.prep.outputs.data_run }}
          github-token: ${{ github.token }}
      - name: Walk-forward sonuclari
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.prep.outputs.holdout_runs }}
        run: |
          set -euo pipefail
          mkdir -p wf
          for r in $RUNS; do
            gh run download "$r" --repo "${{ github.repository }}" --name walk-forward --dir "wf/$r"
          done
          ls -R wf
      - name: KASA (bir kez)
        working-directory: trade-bot
        run: |
          set -euo pipefail
          gunzip -k ../research.db.gz
          extra=""
          if [ -s tradebot/research/index_costs.json ]; then extra="--index-costs tradebot/research/index_costs.json"; fi
          python -m tradebot.research.run holdout --data ../research.db --wf ../wf/*/wf.json --out ../holdout.json $extra
      - uses: actions/upload-artifact@v4
        with:
          name: holdout
          path: holdout.json
          retention-days: 30
